[project]
name = "nblm-backend"
version = "0.1.0"
description = "NotebookLM Chatbot Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "patchright==1.55.2",
]

[tool.setuptools]
py-modules = ["main"]
[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "services*", "utils*"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
